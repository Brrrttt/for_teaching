<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      form {
        margin: auto;
        border: 5px solid black;
        width: fit-content;
        padding: 20px;
        border-radius: 10px;
      }

      h1 {
        width: fit-content;
        margin: auto;
        color: blue;
      }

      button {
        justify-self: center;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: end;
        height: 100vh;
      }
      button {
        width: 100%;
      }
    </style>
  </head>

  <body>
    <form action="">
      <h1>login form</h1>
      <br />
      <label for="user">username</label>
      <input type="text" name="user" /><br />
      <label for="pass">password</label>
      <input type="password" /><br />
      <button>submit</button>
    </form>
  </body>
</html>
